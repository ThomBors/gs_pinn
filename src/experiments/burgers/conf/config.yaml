defaults:
  - optimization: ls
  - paths: default
  - hydra: default



random_seed: 42
save_model: False

trainer:
  use_cuda: True
  n_epochs: 30000 
  warmup_epoch: 500 
  lr: 0.001
  final_lr: 0.0001

data:
  n_boundary: 250
  n_initial: 250
  n_internal: 10000
  update_training_data: true
  data_sampler: latin_hypercube
  x_end: 1.0
  x_start: -1.0
  simulation_time: 1.0

logger:
  type: None
  project: "MTL_PINN_optimization"
  offline: False
  
